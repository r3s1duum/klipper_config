[gcode_macro CLEAN_NOZZLE]
    variable_start_x: 320 # starting position - offset a bit to the right from the brush
    variable_start_y: 352 # starting Y position - offset a bit to the front of the brush
    variable_start_z: 8   #starting Z height. This should barely touch the surface of the brush
    variable_x_min: 268     #left side of the brush
    variable_x_max: 308     #right side of the brush
    variable_y_min: 352 #front side of the brush - make sure the nozzle is over the last line of bristles
    variable_y_max: 358 #rear side of the brush - make sure the nozzle is over the first line of bristles
    variable_z1: 7 # second z height of the nozzle over the brush - this should be with the nozzle slightly sunk in
    variable_z2: 6 # third z height of the nozzle over the brush - this should be with the nozzle fully sunk into the brush, but not touching the bottom of it.
    variable_wipe_qty: 2 #how many times to run the cleaning sequence
    variable_wipe_spd: 200 #cleaning speed
    variable_raise_distance: 30 # z height after cleaning is done
    gcode:
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28
        {% endif %}

        G90  ; absolute positioning
        ### Move nozzle to start position
        G1 X{start_x} Y{start_y} F9000
        G1 X{x_max} Y{y_min} F9000
        G1 Z{start_z} F1500
        ### Wipe nozzle
        {% for wipes in range(1, (wipe_qty + 1)) %} #wipe left and right
            G1 Y{y_min} F{wipe_spd * 60}
            G1 X{x_min} F{wipe_spd * 60}
            G1 X{start_x} F{wipe_spd * 60}

            G1 Y{y_max} F{wipe_spd * 60}
            G1 X{x_min} F{wipe_spd * 60}
            G1 X{start_x} F{wipe_spd * 60}
            G1 Z{z1} F1500
            G1 Y{y_min} F{wipe_spd * 60}
            G1 X{x_min} F{wipe_spd * 60}
            G1 X{start_x} F{wipe_spd * 60}

            G1 Y{y_max} F{wipe_spd * 60}
            G1 X{x_min} F{wipe_spd * 60}
            G1 X{start_x} F{wipe_spd * 60}
            G1 Z{z2} F1500
            G1 Y{y_min} F{wipe_spd * 60}
            G1 X{x_min} F{wipe_spd * 60}
            G1 X{start_x} F{wipe_spd * 60}

            G1 Y{y_max} F{wipe_spd * 60}
            G1 X{x_min} F{wipe_spd * 60}
            G1 X{start_x} F{wipe_spd * 60}

            G1 Z{start_z} F1500
        {% endfor %}

        {% for wipes in range(1, (wipe_qty + 1)) %} #wipe diagonally
            G1 Z{start_z} F1500
            G1 X{x_min} Y{y_min} F{wipe_spd * 60}
            G1 X{x_max} Y{y_max} F{wipe_spd * 60}
            G1 X{x_min} Y{y_min} F{wipe_spd * 60}
            G1 X{x_max} Y{y_max} F{wipe_spd * 60}
            G1 Z{z1} F1500
            G1 X{x_min} Y{y_min} F{wipe_spd * 60}
            G1 X{x_max} Y{y_max} F{wipe_spd * 60}
            G1 X{x_min} Y{y_min} F{wipe_spd * 60}
            G1 X{x_max} Y{y_max} F{wipe_spd * 60}
            G1 Z{z1} F1500
            G1 X{x_min} Y{y_max} F{wipe_spd * 60}
            G1 X{x_max} Y{y_min} F{wipe_spd * 60}
            G1 X{x_min} Y{y_max} F{wipe_spd * 60}
            G1 X{x_max} Y{y_min} F{wipe_spd * 60}
            G1 Z{z2} F1500
            G1 X{x_min} Y{y_min} F{wipe_spd * 60}
            G1 X{x_max} Y{y_max} F{wipe_spd * 60}
            G1 X{x_min} Y{y_min} F{wipe_spd * 60}
            G1 X{x_max} Y{y_max} F{wipe_spd * 60}
            G1 X{x_min} Y{y_max} F{wipe_spd * 60}
            G1 X{x_max} Y{y_min} F{wipe_spd * 60}
            G1 X{x_min} Y{y_max} F{wipe_spd * 60}
            G1 X{x_max} Y{y_min} F{wipe_spd * 60}
            G1 X{start_x} Y{y_min} F{wipe_spd * 60}

            G1 Z{start_z} F1500
        {% endfor %}

        G1 X{start_x} Y{start_y} F9000 #go back to starting position
        ## Raise nozzle
        G1 Z{raise_distance}

[gcode_macro PRINT_START]
    # TODO: Remove duplicate lines
    variable_x2: 350 # right or brush  <<<edit this value>>>
    variable_y1: 358 # y value         <<<edit this value>>>
    variable_z1: 20 # nozzle height   <<<edit this value>>>
    #   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
    gcode:
        M190 S{ params.BED } # Set bed temp and wait
        M109 S150 # Set nozzle temp to relative low temp and wait

        G28 #
        G90 #set absolute positioning
        M107 #turn off parts fan

        QUAD_GANTRY_LEVEL
        G28 Z # home Z to reset the z height

        BED_MESH_CALIBRATE ADAPTIVE=1

        # Move nozzle to the purge array.
        G1 Z{z1} F3000
        G1 X{x2} Y{y1} F3600

        M109 S{ params.EXTRUDER } # Set nozzle temp and wait

        G4 P120000   ; wait 2 minutes for oozing to finish

        CLEAN_NOZZLE

        G28 Z
        CALIBRATE_Z

        LINE_PURGE


[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 10, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5.0 F1800                 ; retract filament

    TURN_OFF_HEATERS

    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 35} F3600  ; park nozzle at rear
    M107                                     ; turn off fan

    BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END


[gcode_macro PURGE_LINE]
gcode:
      #Move to start position
      G1 X10.1 Y20 Z0.28 F5000.0
      #Draw the first line
      G1 X10.1 Y200.0 Z0.28 F1500.0 E15
      #Move to the side
      G1 X10.4 Y200.0 Z0.28 F5000.0
      #Draw the second line
      G1 X10.4 Y20 Z0.28 F1500.0 E30
      #Reset Extruder
      G92 E0

[gcode_macro G27]
gcode:
  {% set default_x = printer.toolhead.axis_minimum.x + 20 %}
  {% set default_y = printer.toolhead.axis_minimum.y + 20 %}

  {% if 'save_variables' in printer %}
    {% set svv = printer.save_variables.variables %}
    {% if 'park_x' in svv %}
      {% set default_x = svv.park_x %}
    {% endif %}
    {% if 'park_y' in svv %}
      {% set default_y = svv.park_y %}
    {% endif %}
  {% endif %}

  {% set x = params.X|default(default_x)|float %}
  {% set y = params.Y|default(default_y)|float %}
  {% set z = params.Z|default(20)|float %}

  {% if printer.toolhead.homed_axes != "xyz" %}
    {action_respond_info("Please home XYZ first")}
  {% else %}
    SAVE_GCODE_STATE NAME=G27_state
    G91
    G1 Z{z}
    G90
    G1 X{x} Y{y} F3000
    RESTORE_GCODE_STATE NAME=G27_state MOVE=0
  {% endif %}

[pause_resume]
recover_velocity: 300.0

# Filament change
[gcode_macro M0]
gcode:
    PAUSE


[gcode_macro M600]
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    SET_IDLE_TIMEOUT TIMEOUT=3600
    PAUSE
    G91
    G1 E-.8 F2700
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91
    G1 E-50 F1000
    RESTORE_GCODE_STATE NAME=M600_state


[gcode_macro m601]
description: Pauses the current print.
  Usage: M601
gcode:
  PAUSE

[gcode_macro m602]
description: Resumes the currently paused print.
  Usage: M602
gcode:
  RESUME

[gcode_macro m24]
rename_existing: M24.6245197
gcode:
  {% if printer.pause_resume.is_paused %}
  RESUME
  {% else %}
  M24.6245197
  {% endif %}

[gcode_macro m25]
rename_existing: M25.6245197
gcode:
  PAUSE

##Bambu slicer

[gcode_arcs]
resolution: 0.1

[gcode_macro m201]
gcode:
  {% if 'X' in params or 'Y' in params %}
    {% set accel = (params.X|default(params.Y)|float,
                    params.Y|default(params.X)|float)|min %}
      minimum_cruise_ratio: 0.5
  {% else %}
    SET_VELOCITY_LIMIT
  {% endif %}

[gcode_macro m203]
gcode:
  {% if 'X' in params or 'Y' in params %}
    {% set speed = (params.X|default(params.Y)|float,
                      params.Y|default(params.X)|float)|min %}
    SET_VELOCITY_LIMIT VELOCITY={speed}
  {% else %}
    SET_VELOCITY_LIMIT
  {% endif %}

[gcode_macro M205]
gcode:
  {% if 'X' in params or 'Y' in params %}
    {% set corner_speed = (params.X|default(params.Y)|float,
                      params.Y|default(params.X)|float)|min %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={corner_speed}
  {% else %}
    SET_VELOCITY_LIMIT
  {% endif %}

[gcode_macro M900]
gcode:
      SET_PRESSURE_ADVANCE ADVANCE={params.K}
