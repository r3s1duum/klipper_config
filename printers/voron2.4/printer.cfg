# This file contains common pin mappings for the BigTreeTech Octopus V1.
# To use this config, the firmware should be compiled for the STM32F446 with a "32KiB bootloader"
# Enable "extra low-level configuration options" and select the "12MHz crystal" as clock reference

# after running "make", copy the generated "klipper/out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the OctoPus with that SD card.

# See docs/Config_Reference.md for a description of parameters.

## Voron Design VORON2 350mm BigTreeTech OctoPus V1 TMC2209 UART config

# ###########################################################################
# Own macro collection
# ###########################################################################
[include mainsail.cfg]
[include printers/voron2.4/macros/macros.cfg]

# ###########################################################################
# KAMP Macros and Settings
# Official repository: https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging
# ###########################################################################
[include KAMP/KAMP_Settings.cfg]
[include KAMP/Line_Purge.cfg]

# ###########################################################################
# Klicky configuration
# ###########################################################################
# TODO: It'd worth to handle this as a submodule
# Simple way to include all the various klicky macros and configurations
# the current home for this configuration is https://github.com/jlas1/Klicky-Probe, please check it

[include printers/voron2.4/Klicky/klicky-variables.cfg]
[include printers/voron2.4/Klicky/klicky-macros.cfg]
[include printers/voron2.4/Klicky/klicky-bed-mesh-calibrate.cfg]
[include printers/voron2.4/Klicky/klicky-quad-gantry-level.cfg]
[include printers/voron2.4/Klicky/klicky-z-calibration.cfg] # Custom g-code because of klipper_z_calibration

# ###########################################################################
# Common, config specific settings
# ###########################################################################
# Printer is capable to pause and resume during prints, because of smart filament sensor
[pause_resume]
recover_velocity: 300

# In slicer this functionality is also enabled and i'm printing multiple parts together
[exclude_object]

# KlipperScreen is being used so it's useful to track the progress of the print/macros etc.
[display_status]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_070023000950304E35313720-if00
restart_method: command

[virtual_sdcard]
path: /home/residuum/printer_data/gcodes

[printer]
kinematics: corexy
max_velocity: 400
max_accel: 8100
minimum_cruise_ratio: 0.5
max_z_velocity: 15 # Max 15 for 12V TMC Drivers
max_z_accel: 200
square_corner_velocity: 5.0

#####################################################################
# Input shaper
#####################################################################
[resonance_tester]
# Commented out fields are overriden by nitehawk board
# accel_chip: adxl345
accel_per_hz: 50 #default is 75
probe_points:
    175, 175, 20  # an example
max_smoothing: 0.25  # an example

[input_shaper]
shaper_freq_x: 52.4
shaper_type_x: mzv
shaper_freq_y: 37.8
shaper_type_y: mzv

#####################################################################
# Stepper Settings
#####################################################################
# --------- X stepper ---------
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200
# endstop_pin: PG6: nhk
position_min: 0
position_endstop: 349
position_max: 350
homing_speed: 25
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

# --------- Y stepper ---------
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200
endstop_pin: PG9
position_min: 0
position_endstop: 359
position_max: 362
homing_speed: 25
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

# --------- Z stepper ---------
##  Z0 Stepper - Front Left
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: PG10
# position_endstop: 0.75 # Because klipper_z_calibration this functionality is unused
position_max: 230 # Lower the z axis maximum value because of the custom nitehawk case
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z1 Stepper - Rear Left
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z2 Stepper - Rear Right
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z3 Stepper - Front Right
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


#####################################################################
#   Extruder
#####################################################################
[extruder]
# Commented out fields are overriden by nitehawk board
# step_pin: PE2
# dir_pin: PE3
# enable_pin: !PD4
rotation_distance: 8 #Bondtech LGX
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
# heater_pin: PA2
# sensor_pin: PF4
sensor_type: ATC Semitec 104NT-4-R025H42G
min_temp: 10
max_temp: 300
max_power: 1.0
min_extrude_temp: 170
max_extrude_cross_section: 5
max_extrude_only_distance: 120

[verify_heater extruder]
max_error: 120
check_gain_time: 45
hysteresis: 15
heating_gain: 2


[tmc2209 extruder]
# Commented out fields are overriden by nitehawk board
# uart_pin: PE1
# sense_resistor: 0.110
# interpolate: false
run_current: 0.5
stealthchop_threshold: 0

#####################################################################
# Filament sensor (BTT Smart Filament Sensor V2)
#####################################################################
[filament_switch_sensor switch_sensor]
switch_pin: ^PG13
pause_on_runout: false
runout_gcode:
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Filament switch runout
insert_gcode:
  M117 Filament switch inserted

[filament_motion_sensor encoder_sensor]
switch_pin: ^PG12
detection_length: 5
extruder: extruder
pause_on_runout: false
runout_gcode:
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Filament encoder runout
insert_gcode:
  M117 Filament encoder inserted

#####################################################################
#   Bed Heater
#####################################################################
[heater_bed] # SSR
heater_pin: PA3
sensor_type: Generic 3950
sensor_pin: PF3
max_power: 0.65
min_temp: 0
max_temp: 120

#####################################################################
# Klicky Probe
#####################################################################
[probe]
# Commented out fields are overriden by nitehawk board
# pin: PG15
x_offset: 0
y_offset: 19.75
speed: 2
samples:3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.01
samples_tolerance_retries: 3

#####################################################################
# Temperature Sensors
#####################################################################
[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor chamber]
sensor_type: BME280
i2c_address: 118
i2c_mcu: mcu
i2c_bus: i2c1a
i2c_speed: 100000
min_temp: 0
gcode_id: AMB

#####################################################################
# Fan Control
#####################################################################
[fan] # Part cooling fan
# Commented out fields are overriden by nitehawk board
# pin: PA8
kick_start_time: 0.5
off_below: 0.05

[heater_fan hotend_fan]
# Commented out fields are overriden by nitehawk board
# pin: PE5
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

[temperature_fan board_fans]
pin: PD12
kick_start_time: 0.8
off_below: 0.4
max_power: 1.0
sensor_type: temperature_host
control: pid
min_temp: -40
max_temp: 85
pid_kp: 1.0
pid_ki: 0.5
pid_kd: 2.0
min_speed: 0.0
max_speed: 0.9
target_temp: 40

[temperature_fan chamber]
pin: PD13
maximum_deviation: 999
max_speed: 1.0
min_speed: 0
kick_start_time: 0.5
sensor_type: temperature_combined
sensor_list: temperature_sensor chamber
combination_method: min
min_temp: 0
max_temp: 65
target_temp: 50
control: pid
hardware_pwm: true
pid_kp: 40.0
pid_ki: 5.0
pid_kd: 0.01

[fan_generic Nevermore]
pin: PD14
max_power: 1.0

#####################################################################
# LED Control
#####################################################################
[output_pin caselight]
pin: PB10
pwm:true
shutdown_value: 0
value:1
cycle_time: 0.01

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################
[quad_gantry_level]
gantry_corners:
  -60,-10
  410,420
points:
  50,25
  50,275
  300,275
  300,25
speed: 100
horizontal_move_z: 12
retries: 5
retry_tolerance: 0.01
max_adjust: 10

[bed_mesh] # Adaptive
speed: 300
horizontal_move_z: 10
mesh_min: 40, 40
mesh_max: 310,310
fade_start: 0.6
fade_end: 10.0
probe_count: 9,9 # Values should be odd, so one point is directly at bed center
algorithm: bicubic
zero_reference_position: 175, 175
adaptive_margin: 5

# Include the nitehawk-36.cfg for Nitehawk specific settings
# Must be at the end to avoid conflicts
[include printers/voron2.4/nitehawk-36.cfg]

