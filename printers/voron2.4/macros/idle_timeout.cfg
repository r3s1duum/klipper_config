[idle_timeout]
timeout: 3600
gcode:
    {% if printer.pause_resume.is_paused %}
        M118 Bypassed Timeout
        M117 Bypassed Timeout
    {% else %}
        M118 Timeout Reached - Heaters turned off, motors still on
        M117 Timeout Reached - Heaters turned off, motors still on
        TURN_OFF_HEATERS
        #M84
    {% endif %}
