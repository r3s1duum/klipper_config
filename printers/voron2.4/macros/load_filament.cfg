# Special thanks to @Martin-Schnebbe for sharing his macro, which was being used as a baseline.
[gcode_macro LOAD_FILAMENT]
variable_load_distance: 40         # Distance to load filament into the extruder
variable_purge_distance: 50        # Distance to purge filament after loading
gcode:
    # Parameters and settings
    {% set load_speed = params.LOAD_SPEED|default(500) %}   # Speed in mm/min for fast filament loading
    {% set purge_speed = params.PURGE_SPEED|default(250) %} # Speed in mm/min for purging filament
    {% set retract = params.RETRACT|default(5.0)|float %}   # Retract after loading, 0 to skip (RESUME primes instead)

    # Refuse to extrude with a cold nozzle, before any state is saved
    {% if printer.extruder.can_extrude|lower != 'true' %}
        {action_raise_error("Nozzle is too cold to load filament. Heat the extruder first.")}
    {% endif %}

    # Save current state of the printer
    SAVE_GCODE_STATE NAME=load_state

    M83     # Relative extruder only, so an error here cannot leave XYZ in relative mode
    G92 E0  # Reset extruder position
    G1 E{load_distance} F{load_speed}   # Load filament at the specified loading speed
    G1 E{purge_distance} F{purge_speed} # Purge filament at the slower purging speed
    {% if retract > 0 %}
    G1 E-{retract} F1800 # Retract filament (less oozing)
    {% endif %}

    # Restore previous state of the printer
    G90 ; Restore absolute positioning
    RESTORE_GCODE_STATE NAME=load_state

    # Completion message
    RESPOND MSG="Filament load complete"
