[gcode_macro CHANGE_FILAMENT]
description:  Change filament macro which pauses the print if it's in progress, unloads the filament,
              asks the user to replace the filament with KlipperScreen / Mainsail prompts. These prompts
              re-fire this macro with a different STEP parameter. Later, it loads the filament above the
              purge bucket. After proceeding, it continues the print / goes idle. Preheat is required.
variable_print_lift: 10      # mm above the current Z when changing during a print
variable_idle_z: 50          # minimum Z when changing while idle
variable_travel_speed: 6000  # mm/min for the XY park move
gcode:
  {% set th = printer.toolhead %}
  {% set step = params.STEP|default('START')|upper %}
  {% set sensors = ['switch_sensor', 'encoder_sensor'] %}
  {% set state = printer.print_stats.state %}
  {% set was_printing = state == 'printing' %}
  {% set was_paused = state == 'paused' %}
  {% set printing = was_printing or was_paused %}
  {% set hot = printer.extruder.can_extrude|lower == 'true' %}
  {% set cur_z = th.position.z|float %}
  {% set max_z = th.axis_maximum.z|float %}

  {% if step in ['START', 'LOAD'] and not hot %}
    {action_raise_error("Nozzle is too cold to change filament. Heat the extruder first.")}
  {% endif %}

  {% if step == 'START' %}
    {% if was_printing %}
      PAUSE
    {% endif %}

    # Stop runout sensors from firing PAUSE while the filament is out.
    # Re-enabled in LOAD (or ABORT).
    {% for s in sensors %}
    SET_FILAMENT_SENSOR SENSOR={s} ENABLE=0
    {% endfor %}

    G90
    {% if "xyz" not in th.homed_axes %}
      G28
    {% endif %}

    {% if printing %}
      # PAUSE has already lifted Z when the print was paused by a runout, so do not lift again.
      {% set lift = 0 if was_paused else print_lift %}
      {% set change_z = [cur_z + lift, max_z]|min %}
    {% else %}
      # Idle
      {% set change_z = [[cur_z, idle_z]|max, max_z]|min %}
    {% endif %}

    G0 Z{change_z} F900
    UNLOAD_FILAMENT
    G0 X0 Y0 F{travel_speed}

    RESPOND TYPE=command MSG="action:prompt_begin Change filament"
    RESPOND TYPE=command MSG="action:prompt_text Filament is unloaded. Remove the old spool, then push the new filament in until it reaches the extruder."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Continue|CHANGE_FILAMENT STEP=LOAD|primary"
    RESPOND TYPE=command MSG="action:prompt_button Abort|CHANGE_FILAMENT STEP=ABORT|error"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"

  {% elif step == 'LOAD' %}
    # Bucket Z must not drop below idle_z: while printing, cur_z is the print height plus lift.
    PURGE_BUCKET Z={[cur_z, idle_z]|max}
    # While printing, skip the 5 mm retract at the end of LOAD_FILAMENT. RESUME adds back the
    # 1 mm that PAUSE retracted, so the nozzle is primed for the first extrusion.
    LOAD_FILAMENT RETRACT={0 if printing else 5}
    {% for s in sensors %}
    SET_FILAMENT_SENSOR SENSOR={s} ENABLE=1
    {% endfor %}

    RESPOND TYPE=command MSG="action:prompt_begin Remove purge"
    RESPOND TYPE=command MSG="action:prompt_text Purge is done. Remove the purge from the bucket, then continue."
    {% if printing %}
      RESPOND TYPE=command MSG="action:prompt_button Resume print|RESUME|primary"
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_button Done|CHANGE_FILAMENT STEP=DONE|primary"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_show"

  {% elif step == 'ABORT' %}
    # Leave the nozzle hot during a print: RESUME does not check the temperature, so a cold
    # nozzle would resume into a dry extruder. Only turn heaters off when idle.
    {% if not printing %}
      TURN_OFF_HEATERS
    {% endif %}
    {% for s in sensors %}
    SET_FILAMENT_SENSOR SENSOR={s} ENABLE=1
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if printing %}
      RESPOND MSG="Filament change aborted. The filament is still unloaded and the print is paused. Load filament and resume, or cancel the print."
    {% else %}
      RESPOND MSG="Filament change aborted. Filament is unloaded and heaters are off."
    {% endif %}

  {% elif step == 'DONE' %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND MSG="Filament change finished."

  {% else %}
    RESPOND MSG="CHANGE_FILAMENT: unknown STEP={step}. Use START, LOAD, ABORT or DONE."
  {% endif %}
