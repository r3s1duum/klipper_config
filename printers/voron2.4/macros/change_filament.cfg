[gcode_macro CHANGE_FILAMENT]
description:  Change filament macro which pauses the print if it's in progress, unloads the filament
              asks the user to replace the filament with KlipperScreen / Mainsail prompts. These prompts
              re-fire this macro with different parameter. Later, it loads the filament above the purge
              bucket. After proceed, it continues the print / goes idle. Preheat is required.
variable_print_lift: 10      # mm above the current Z when changing during a print
variable_idle_z: 50          # minimum Z when changing while idle
variable_travel_speed: 6000  # mm/min for the XY park move
gcode:
  {% set th = printer.toolhead %}
  {% set step = params.STEP|default('START')|upper %}
  {% set printing = printer.print_stats.state in ['printing', 'paused'] %}
  {% set cur_z = th.position.z|float %}
  {% set max_z = th.axis_maximum.z|float %}

  {% if step == 'START' %}
    {% if printing %}
      PAUSE
    {% endif %}

    G90
    {% if "xyz" not in th.homed_axes %}
      G28
    {% endif %}

    {% if printing %}
      {% set change_z = [cur_z + print_lift, max_z]|min %}
    {% else %}
      # Idle
      {% set change_z = [[cur_z, idle_z]|max, max_z]|min %}
    {% endif %}

    G0 Z{change_z} F900
    UNLOAD_FILAMENT
    G0 X0 Y0 F{travel_speed}

    RESPOND TYPE=command MSG="action:prompt_begin Change filament"
    RESPOND TYPE=command MSG="action:prompt_text Filament is unloaded. Remove the old spool, then push the new filament in until it reaches the extruder."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Continue|CHANGE_FILAMENT STEP=LOAD|primary"
    RESPOND TYPE=command MSG="action:prompt_button Abort|CHANGE_FILAMENT STEP=DONE|error"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"

  {% elif step == 'LOAD' %}
    PURGE_BUCKET Z={cur_z}
    LOAD_FILAMENT

    RESPOND TYPE=command MSG="action:prompt_begin Remove purge"
    RESPOND TYPE=command MSG="action:prompt_text Purge is done. Remove the purge from the bucket, then continue."
    {% if printing %}
      RESPOND TYPE=command MSG="action:prompt_button Resume print|RESUME|primary"
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_button Done|CHANGE_FILAMENT STEP=DONE|primary"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_show"

  {% elif step == 'DONE' %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND MSG="Filament change finished."

  {% else %}
    RESPOND MSG="CHANGE_FILAMENT: unknown STEP={step}. Use START, LOAD or DONE."
  {% endif %}
