[gcode_macro PRINT_START]
description:
  Starts the print. Call from the slicer's start G-Code macro with the following parameters:
    - EXTRUDER_TEMP: Final temperature of the nozzle/extruder
    - BED_TEMP: Final temperature of the bed
    - BUILD_PLATE: Type of the build plate
gcode:
  # !NOTICE: `M104 S0` and `M140 S0` are mandatory in the slicer before the PRINT_START macro
  #           Reason: This macro is handling the heating and slicers don't like it
  # ###########################################################################
  # Prerequisites
  # ###########################################################################
  # Constants
  {% set TEXTURED_PEI_NAME = "Textured PEI Plate" %}
  {% set SMOOTH_NAME = "Smooth High Temp Plate" %}

  # Parsing parameters
  {% set bt = params.BED_TEMP|default(-1)|int %}
  {% set et = params.EXTRUDER_TEMP|default(-1)|int %}
  {% set bp = params.BUILD_PLATE|default("")|string %}

  # Guards:
  {% if bt == -1 %} {action_raise_error("BED_TEMP is not set!")} {% endif %}
  {% if et == -1 %} {action_raise_error("EXTRUDER_TEMP is not set!")} {% endif %}
  {% if bp == "" %} {action_raise_error("BUILD_PLATE is not set!")} {% endif %}
  {% if bp not in [TEXTURED_PEI_NAME, SMOOTH_NAME] %} {action_raise_error("BUILD_PLATE isn't supported!")} {% endif %}

  # ###########################################################################
  # QGL and map the bed
  # ###########################################################################
  M190 S{bt}  # Heat the bed until the target temp

  {% if printer.toolhead.homed_axes != "xyz" %}
    G28 # Home all axes if it's not homed already
  {% endif %}
  G90 # set absolute positioning

  ATTACH_PROBE_LOCK # Spare time with probe lock and unlock
  QUAD_GANTRY_LEVEL
  G28 Z # After QGL the Z hight can differ so reset it (there is enough space to home with the probe)
  BED_MESH_CALIBRATE ADAPTIVE=1
  DOCK_PROBE_UNLOCK

  # ###########################################################################
  # Clean nozzle and finalize extruder temp
  # ###########################################################################
  M109 S{et} # Set nozzle temp and wait
  CLEAN_NOZZLE

  # ###########################################################################
  # Adjust offset for the print
  # ###########################################################################
  G28 Z # Reset the Z reference with cleaned and heated nozzle.
  CALIBRATE_Z

  {% if bp == TEXTURED_PEI_NAME %}
      # PEI sheet requires more squish to fill the tiny gaps
      SET_GCODE_OFFSET Z_ADJUST=-0.05
  {% elif bp == SMOOTH_NAME %}
      SET_GCODE_OFFSET Z_ADJUST=0.0
  {% endif %}

  # ###########################################################################
  # Do an adaptive purge (KAMP)
  # ###########################################################################
  LINE_PURGE
