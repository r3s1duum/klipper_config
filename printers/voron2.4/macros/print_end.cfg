[gcode_macro PRINT_END]
description:
  Ends the print. Call from the slicer's end G-code without parameters.
gcode:
  # ###########################################################################
  # Prerequisites
  # Anti-stringing move calculation
  # ###########################################################################
  {% set th = printer.toolhead %}
  {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
  {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
  {% set z_safe = [th.position.z + 10, th.axis_maximum.z]|min %}

  # ###########################################################################
  # Turn-off, anti-stringing
  # ###########################################################################
  M400            # finish all queued moves
  G91             # Set to relative positioning
  G1 E-5.0 F1800  # retract filament
  G90             # Set back to absoute positioning
  TURN_OFF_HEATERS

  G0 X{x_safe} Y{y_safe} Z{z_safe} F20000                     # move nozzle to remove stringing
  G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 35} F6000  # park nozzle at rear
  M107 # Turn off part cooling fan

  BED_MESH_CLEAR
