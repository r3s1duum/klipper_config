[gcode_macro PURGE_BUCKET]
description: Move to purge bucket location. Optional Z parameter sets the bucket height.
variable_x_purge: 350        # bucket X
variable_y_purge: 358        # bucket Y
variable_min_z: 50           # default bucket height when the nozzle is lower than this
gcode:
  {% set th = printer.toolhead %}
  {% set max_z = th.axis_maximum.z|float %}
  # Default: keep the current Z, but not below min_z. No extra lift is added, so repeated
  # calls do not push Z up each time.
  {% set z_pos = [th.position.z|float, min_z]|max %}
  {% set safe_z = [params.Z|default(z_pos)|float, max_z]|min %}
  G90
  # Lift before moving in XY so the nozzle does not drag across the print or bucket.
  G0 Z{[safe_z, th.position.z|float]|max} F20000
  G0 X{x_purge} Y{y_purge} F20000
  # Descend to the bucket height if it is below the current Z.
  G0 Z{safe_z} F20000
