[gcode_macro PURGE_BUCKET]
description: Move to purge bucket location
variable_x_purge: 350
variable_y_purge: 358
gcode:
  {% set th = printer.toolhead %}
  {% if th.position.z < 50 %}
    {% set z_pos = 50 %}
  {% else %}
    {% set z_pos = th.position.z + 10 %}
  {% endif %}
  {% set safe_z = [params.Z|default(z_pos)|float, th.axis_maximum.z]|min %}
  G0 X{x_purge} Y{y_purge} Z{safe_z} F20000
