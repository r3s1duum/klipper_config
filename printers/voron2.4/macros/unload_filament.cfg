# Special thanks to @Martin-Schnebbe for sharing his macro, which was being used as a baseline.
[gcode_macro UNLOAD_FILAMENT]
variable_unload_distance: 90      # Distance to retract filament from the extruder
gcode:
    # Parameters and settings
    {% set retract_speed = params.RETRACT_SPEED|default(600) %}  # Speed for retracting filament

    # Refuse to extrude with a cold nozzle, before any state is saved
    {% if printer.extruder.can_extrude|lower != 'true' %}
        {action_raise_error("Nozzle is too cold to unload filament. Heat the extruder first.")}
    {% endif %}

    # Save current state of the printer
    SAVE_GCODE_STATE NAME=unload_state

    # Begin filament unloading process
    M83 ; Relative extruder only, so an error here cannot leave XYZ in relative mode
    G92 E0 ; Reset extruder position
    G1 E-{unload_distance} F{retract_speed} ; Retract filament at the specified speed

    # Restore previous state of the printer
    G90 ; Restore absolute positioning
    RESTORE_GCODE_STATE NAME=unload_state

    # Completion message
    RESPOND MSG="Filament unload complete"
