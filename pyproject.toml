[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "klipper-format"
version = "0.1.0"
description = "Check and fix whitespace and indentation in the Klipper config repo"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
klipper-format = "klipper_format:main_cli"

[tool.setuptools]
packages = ["klipper_format"]
