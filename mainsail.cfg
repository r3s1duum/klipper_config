# Common print-control macros (PAUSE, RESUME, CANCEL_PRINT).
# Originally taken from the voron2.4 macros; the voron2.4 macros now live in printers/voron2.4/macros/.
# Printer-specific values belong in each printer's own files.

# Cancel print macro
[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
variable_park_y_margin: 35   # mm from the rear Y axis maximum to park, same as PRINT_END
gcode:
  {% set th = printer.toolhead %}
  {% set max_x = th.axis_maximum.x|float %}
  {% set max_y = th.axis_maximum.y|float %}
  {% set max_z = th.axis_maximum.z|float %}

  G90 ; absolute positioning, so no later move depends on the caller's mode
  M400 ; wait for buffer to clear
  G92 E0 ; zero the extruder
  {% if printer.extruder.can_extrude|lower == 'true' %}
    {% if printer[th.extruder].target > 220 %}
      G1 E-5.0 F3600 ; retract filament, high-temp material (ABS/ASA/PETG)
    {% else %}
      G1 E-1.0 F3600 ; retract filament, lower-temp material (PLA)
    {% endif %}
  {% else %}
    {action_respond_info("Extruder not hot enough, skipping retract")}
  {% endif %}
  TURN_OFF_HEATERS
  CLEAR_PAUSE
  SDCARD_RESET_FILE
  M107 ; turn off fan

  {% if "xyz" in th.homed_axes %}
    # Move away from the print to remove stringing. Every target is clamped to the axis limits.
    G0 X{[th.position.x|float + 20, max_x]|min} Y{[th.position.y|float + 20, max_y]|min} Z{[th.position.z|float + 1, max_z]|min} F20000
    G1 Z{[th.position.z|float + 5, max_z]|min} F3000 ; lift 5 mm in total
    # Park at the rear, same position as PRINT_END
    G0 X{max_x//2} Y{max_y - park_y_margin} F3600
  {% else %}
    {action_respond_info("Printer not homed, skipping park move")}
  {% endif %}


# Pause print macro
[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
# change this if you need more or less extrusion
variable_extrude: 1.0
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  ##### set park position for x and y #####
  # default is your max position from your printer.cfg
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  ##### calculate safe lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - 10.0) %}
      {% set z_safe = 10.0 %}
  {% else %}
      {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  PAUSE_BASE
  {% if printer.extruder.can_extrude|lower == 'true' %}
    # Relative mode only for the retract. RESTORE puts back whatever mode the caller had.
    SAVE_GCODE_STATE NAME=pause_retract
    G91
    G1 E-{E} F2100
    RESTORE_GCODE_STATE NAME=pause_retract
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    # Absolute moves for the lift and park, so no relative mode is left on
    G90
    G1 Z{[act_z + z_safe, max_z]|min} F900
    G1 X{x_park} Y{y_park} F6000
  {% else %}
    {action_respond_info("Printer not homed, skipping lift and park")}
  {% endif %}

# Resume print macro
[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  # Resuming into a cold nozzle would run the print dry, so stop here and keep it paused.
  {% if printer.extruder.can_extrude|lower != 'true' %}
    {action_raise_error("Nozzle is too cold to resume. Heat the extruder, then resume.")}
  {% endif %}
  # Prime the extruder. Relative mode is only for this move; RESTORE puts back the caller's mode.
  SAVE_GCODE_STATE NAME=resume_prime
  G91
  G1 E{E} F2100
  RESTORE_GCODE_STATE NAME=resume_prime
  RESUME_BASE {get_params}
